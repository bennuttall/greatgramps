[project]
name = "greatgramps"
version = "0.1.0"
description = "Family tree static site generator for GRAMPS databases"
authors = [
    { name = "Ben Nuttall", email = "ben@bennuttall.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chameleon (>=4.6.0,<5.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]

[project.scripts]
gg-add-place = "greatgramps.cli_places:add_place"
gg-search-place = "greatgramps.cli_places:search_places"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
